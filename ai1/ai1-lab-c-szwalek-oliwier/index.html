<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Puzzle</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/leaflet-image@0.4.0/leaflet-image.js"></script>
<head>
<body>
    <div class ="container" id="mapholder">
        <div class="canvas-wrapp">
            <h3>Twoja lokalizacja</h3>
            <canvas id="canvasMap1" width="400" height="300"></canvas>
        </div>

        <div class="canvas-wrapp">
            <h3>Mapa</h3>
            <div id="map"></div>
        </div>

        <div class="canvas-wrapp">
            <h3>Mapa raster</h3>
            <canvas id="canvasMap2" width="400" height="300"></canvas>
        </div>
    
    </div>


    <div class="container" id="btns-container">
        <div class="button" id="btn-moja-lokalizacja">Moja lokalizacja</div>
        <div class="button" id="btn-pobierz">Pobierz mape</div>
    </div>

    <div class="container" id="puzzle-container" style="display:none;">
        <div class="canvas-wrapp">
            <h3>Puzzle</h3>
            <div id="puzzle"></div>
        </div>
    

        <div class="canvas-wrapp">
            <h3>Upusc puzzle</h3>
            <div id="puzzle-target"></div>
        </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
